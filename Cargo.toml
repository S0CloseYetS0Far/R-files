[package]
name = "rfiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A light, black, tabbed file explorer for Linux with a live preview pane"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
poppler-rs = "0.26"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# setrlimit and kill for the thumbnail helper process (already used by glib; see thumbs.rs)
libc = "0.2"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz", "optimization"] }
bzip2 = "0.6"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Debian package: `cargo install cargo-deb --locked && cargo deb`. It has no D-Bus service file on purpose;
# making RFiles the default file manager stays a choice the user makes with `install.sh set-default`.
[package.metadata.deb]
name = "rfiles"
section = "utils"
priority = "optional"
maintainer = "RFiles maintainers <noreply@github.com>"
extended-description = "RFiles is a light, black, tabbed file explorer with a live preview pane."
# The symbol scan only sees GTK 4.12; the code uses 4.14 APIs (feature v4_14)
depends = "$auto, libgtk-4-1 (>= 4.14)"
assets = [
    ["target/release/rfiles", "usr/bin/", "755"],
    ["rfiles.desktop", "usr/share/applications/", "644"],
    ["data/io.github.rfiles.Files.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
