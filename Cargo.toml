[package]
name = "rfiles"
version = "0.1.0"
edition = "2021"
description = "A light, black, tabbed file explorer for Linux with a live preview pane"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
poppler-rs = "0.26"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
