name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 24.04 ships GTK 4.14, the oldest the code (gtk4-rs feature v4_14) and the README support; 26.04 is the newest.
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # shared-mime-info: content types and their descriptions in the sort tests;
      # locales: an English UTF-8 locale, without which the locale order tests skip themselves.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libpoppler-glib-dev build-essential pkg-config shared-mime-info locales
          sudo locale-gen en_US.UTF-8
          pkg-config --modversion gtk4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
